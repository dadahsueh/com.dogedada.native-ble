[package]
name = "unity_native_ble"
version = "0.1.0"
edition = "2021"

[lib]
name = "unity_native_ble"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
interoptopus = "0.14.27"
btleplug = "0.11.8"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync"] }
futures = "0.3"
uuid = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release-with-debug]
inherits = "release"
strip = false
debug = true

[features]
default = []
