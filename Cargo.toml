[package]
name = "unity_native_ble"
version = "0.3.0"
edition = "2021"

[lib]
name = "unity_native_ble"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
interoptopus = "0.14.27"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
uuid = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(not(target_env = "ohos"))'.dependencies]
btleplug = "0.11.8"

[target.'cfg(all(not(target_os = "android"), not(target_env = "ohos")))'.dependencies]
ble-peripheral-rust = "0.2.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.19"

[target.'cfg(target_env = "ohos")'.dependencies]
napi-ohos = { version = "1.2.0", features = ["napi8"] }
napi-derive-ohos = "1.2.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release-with-debug]
inherits = "release"
strip = false
debug = true

[features]
default = []
